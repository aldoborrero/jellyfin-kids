overview: "Parent-controlled kids profiles"
description: >
  Server side of kids mode for Jellyfin clients such as Peke for Jellyfin: kid
  profiles with avatars, a household parent lock, screen time shared across
  devices and per-kid live TV, through an API any client can use.
category: "Administration"
owner: "aldoborrero"
artifacts:
- "Jellyfin.Plugin.Kids.dll"
changelog: >
  Undo a bonus: POST /Kids/Users/{id}/WatchTime/Bonus now answers the new bonus's id and until when it can be undone.
  An administrator or a parent grant holder can undo it with DELETE /Kids/Users/{id}/WatchTime/Bonus/{bonusId} within
  10 minutes on the same day, and gets the kid's new status (time's up can come back). Ids are never reused, so two
  TVs never undo each other's bonus. GET /Kids/Users/{id}/WatchTime/Bonus lists today's bonuses. Bonuses given with a
  parent grant are recorded as such. Undos are logged.
  End a break: POST /Kids/Users/{id}/WatchTime/Break/End lets a kid in the break after their sitting limit watch again
  at once, keeping today's used time and bonus; the next sitting starts from zero at the next playback. Logged.
  GET /Kids/Info reports API 1.2 (ApiMinorVersion 2) with the bonusUndo and breakEnd capabilities. The kid editor lists
  today's bonuses with Undo and shows End break during a break. The plugin database moves to schema 5.
