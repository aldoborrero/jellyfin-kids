changelog: >
  UPGRADE NOTE: this update cuts every kid's live TV until a parent picks their channels (Dashboard → Kids → the
  kid → "Live TV channels"), even with enforcement off.
  Live TV for kids: each kid's profile lists the live TV channels they may watch. Always on, whatever
  EnforcementEnabled says: on every client a kid can only play, list and see the guide of their own channels, and
  recordings and timers are refused. Live TV counts as screen time like any playback. Kids read their channels and
  guide from /Kids/Users/{id}/LiveTv/Channels and /LiveTv/Programs (capability liveTv).
