overview: "Parent-controlled kids profiles"
description: >
  Server side of kids mode for Jellyfin clients such as Peke for Jellyfin: kid
  profiles with avatars, a household parent lock, screen time shared across
  devices and per-kid live TV, through an API any client can use.
category: "Administration"
owner: "aldoborrero"
artifacts:
- "Jellyfin.Plugin.Kids.dll"
changelog: >
  Kid avatars: a kid profile can name an avatar (leo, max, nico, lucy, sara or mia; none means the Jellyfin profile
  image). Kids and administrators read it in the profile, administrators and parent grant holders set it, and
  GET /Kids/Profiles lists every kid's avatar so a TV can show who is watching. GET /Kids/Info reports API 1.1
  (ApiMinorVersion 1) and the avatar capability. The kid editor has an Avatar choice, and kid rows show it as a
  coloured initial.
  Hidden live TV channels: when Jellyfin's own parental control hides a picked channel from a kid (unrated live TV
  channels blocked, or a rating above the kid's maximum), the Kids page and the kid editor name the kid, the channel
  and how to fix it, with a link to the kid's Parental control tab. The administrators' channel list gains each
  channel's rating and, for a user, whether Jellyfin hides it from them.
  Peke for Jellyfin is now named as the kids client; the plugin's API stays open to any client.
