changelog: >
  The plugin's data moves to a safe place. The database (kid profiles, the parent code verifier, screen time, bonuses,
  channels and picks) used to live in plugins/Jellyfin.Plugin.Kids/, next to the plugin's install folder, where it
  looked like a stray old install. It now lives in data/kids/kids.db in Jellyfin's data folder, next to Jellyfin's own
  database (for example /var/lib/jellyfin/data/kids/, or /config/data/kids/ in Docker). On its first start this version
  moves it: it copies the database with SQLite's backup (pending write-ahead log changes included), checks the copy
  (integrity check, same schema version, same rows in every table), switches to it, and renames the old file
  kids.db.migrated-<date>, kept for one release. Every step is logged, and an interrupted move resumes at the next
  start. A locked or damaged old database is left untouched and nothing is created; if both folders hold a database
  the one written later is used and the other kept as kids.db.older-<date-time>, or the plugin refuses with an error
  when it cannot tell. A README.txt in the folder says what it is and not to delete it. Dashboard → Kids shows the data
  folder under Data (GET /Kids/Admin/Storage, administrators only). Jellyfin's own backup does not include plugin data:
  back up the folder (see docs/install.md, "Your data"). Downgrading to 0.0.9.0 starts with no kids unless you copy
  data/kids/kids.db back to plugins/Jellyfin.Plugin.Kids/ first.
