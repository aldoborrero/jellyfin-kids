description: >
  Server side of kids mode for Jellyfin clients such as Peke for Jellyfin: kid
  profiles with avatars, a household parent lock, screen time shared across
  devices and per-kid live TV, through an API any client can use.
category: "Administration"
owner: "aldoborrero"
artifacts:
- "Jellyfin.Plugin.Kids.dll"
changelog: >
  Configure a kid from one place. The kid editor (Dashboard → Kids → a kid) now has four tabs: Kids, with the
  plugin's settings as before, and Profile, Access and Parental control, which repeat the parts of Jellyfin's own user
  pages that matter for a kid: Live TV access and downloads (and administrator, shown only so it can be turned off),
  which libraries the kid can see, the maximum rating, blocking unrated items and the allowed hours. Each tab saves on
  its own the way Jellyfin does: it reads the user again and changes only its own fields, so nothing else in the
  policy is lost, and a change Jellyfin refuses shows its reason in the tab. A tab with unsaved changes is marked. The
  Fix links of the protection check open the right tab, and each tab links to the kid in Jellyfin's Users pages. No
  API or database change.
