<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="title desc">
  <title id="title">Jellyfin Web</title>
  <desc id="desc">The Jellyfin logo: Jellyfin Web, where the server's rules apply and the Kids dashboard pages live.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14102a"/>
      <stop offset="1" stop-color="#0b1d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <linearGradient id="jf" gradientUnits="userSpaceOnUse" x1="110.25" y1="213.3" x2="496.14" y2="436.09">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="240" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="240" fill="url(#bg)"/>
    <circle cx="1180" cy="30" r="130" fill="#00a4dc" opacity="0.08"/>
    <circle cx="1080" cy="250" r="90" fill="#aa5cc3" opacity="0.10"/>
  </g>

  <!-- Jellyfin logo (CC BY-SA 4.0, Jellyfin contributors) -->
  <g transform="translate(56 40) scale(0.3125)">
    <path d="M256,201.6c-20.4,0-86.2,119.3-76.2,139.4s142.5,19.9,152.4,0S276.5,201.6,256,201.6z" fill="url(#jf)"/>
    <path d="M256,23.3c-61.6,0-259.8,359.4-229.6,420.1s429.3,60,459.2,0S317.6,23.3,256,23.3z M406.5,390.8c-19.6,39.3-281.1,39.8-300.9,0s110.1-275.3,150.4-275.3S426.1,351.4,406.5,390.8z" fill="url(#jf)"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="256" y="100" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Jellyfin <tspan fill="url(#accent)">Web</tspan></text>
    <text x="258" y="142" font-size="26" fill="#c9c3e6">Jellyfin's own app in the browser, and the dashboard.</text>
    <g font-size="19" font-weight="600">
      <rect x="258" y="168" width="120" height="38" rx="19" fill="#ffffff" opacity="0.08"/>
      <text x="318" y="193" text-anchor="middle" fill="#e6e1ff">Browser</text>
      <rect x="390" y="168" width="150" height="38" rx="19" fill="#ffffff" opacity="0.08"/>
      <text x="465" y="193" text-anchor="middle" fill="#e6e1ff">Server rules</text>
      <rect x="552" y="168" width="170" height="38" rx="19" fill="#ffffff" opacity="0.08"/>
      <text x="637" y="193" text-anchor="middle" fill="#e6e1ff">Kids dashboard</text>
    </g>
  </g>
</svg>
