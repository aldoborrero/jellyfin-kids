<!--
  Peke for Jellyfin client card. The buddy mark is Peke's app icon (design/assets/app-icon.svg in
  https://github.com/aldoborrero/peke).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="title desc">
  <title id="title">Peke for Jellyfin</title>
  <desc id="desc">Peke's buddy mark: the kids app for Android TV, built with Jellyfin Kids.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2747"/>
      <stop offset="1" stop-color="#2a2f5c"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="240" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="240" fill="url(#bg)"/>
    <circle cx="1180" cy="30" r="130" fill="#FF927E" opacity="0.10"/>
    <circle cx="1080" cy="250" r="90" fill="#65D9CE" opacity="0.10"/>
  </g>

  <g transform="translate(56 40) scale(0.3125)" stroke-linecap="round" stroke-linejoin="round">
    <rect width="512" height="512" rx="116" fill="#FF927E"/>
    <g transform="translate(66 86) scale(1.46)">
      <path d="M101 40 Q90 14 104 9 Q118 13 117 40 M159 40 Q170 14 156 9 Q142 13 143 40" fill="none" stroke="#65D9CE" stroke-width="12"/>
      <rect x="30" y="40" width="200" height="160" rx="52" fill="#65D9CE" stroke="#1F2747" stroke-width="12"/>
      <rect x="58" y="66" width="144" height="108" rx="30" fill="#FFDA70" stroke="#1F2747" stroke-width="12"/>
      <circle cx="105" cy="112.44" r="9.2" fill="#1F2747"/>
      <circle cx="155" cy="112.44" r="9.2" fill="#1F2747"/>
      <circle cx="78" cy="133.44" r="9" fill="#FF927E" opacity="0.75"/>
      <circle cx="182" cy="133.44" r="9" fill="#FF927E" opacity="0.75"/>
      <path d="M113 137.44 Q130 153.44 147 137.44" fill="none" stroke="#1F2747" stroke-width="12"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="256" y="100" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Peke <tspan fill="#FFDA70">for Jellyfin</tspan></text>
    <text x="258" y="142" font-size="26" fill="#d8dcf0">The kids app for Android TV, made with this plugin.</text>
    <g font-size="19" font-weight="600">
      <rect x="258" y="168" width="140" height="38" rx="19" fill="#FF927E" opacity="0.22"/>
      <text x="328" y="193" text-anchor="middle" fill="#ffd9d1">Android TV</text>
      <rect x="410" y="168" width="168" height="38" rx="19" fill="#65D9CE" opacity="0.22"/>
      <text x="494" y="193" text-anchor="middle" fill="#c9f5f0">Full kids mode</text>
      <rect x="590" y="168" width="200" height="38" rx="19" fill="#FFDA70" opacity="0.22"/>
      <text x="690" y="193" text-anchor="middle" fill="#fff1c7">Reference client</text>
    </g>
  </g>
</svg>
