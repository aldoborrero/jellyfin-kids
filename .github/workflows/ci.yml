name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.Kids.slnx --configuration Release

      - name: Test
        run: dotnet test Jellyfin.Plugin.Kids.slnx --configuration Release --no-build

      # The release packaging, minus the release: catches build.yaml and Directory.Build.props drifting apart
      - name: Package
        run: scripts/release/package.sh
